<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akashic Tarot - Chronicle Admin</title>
    <script>
        // Anti-FOUC: set data-theme before stylesheets paint, sharing
        // the same localStorage key as Three.html so toggling on either
        // page persists everywhere.
        (function () {
            try {
                var stored = localStorage.getItem('akashic-theme');
                var theme = (stored === 'dark' || stored === 'light')
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (e) { document.documentElement.dataset.theme = 'dark'; }
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="admin-page figma-stage">
    <header class="app-topbar admin-topbar">
        <a class="brand-lockup" href="Three.html" aria-label="Back to Akashic Tarot">
            <span class="brand-sigil" aria-hidden="true"></span>
            <span>
                <strong>Akashic Tarot</strong>
                <small>Admin Chronicle Archive</small>
            </span>
        </a>
        <nav class="admin-nav" aria-label="Admin sections">
            <button type="button" data-admin-view="dashboard">总览 / Dashboard</button>
            <button type="button" data-admin-view="readings" class="active">记录 / Readings</button>
            <button type="button" data-admin-view="decks">牌库 / Decks</button>
            <button type="button" data-admin-view="settings">设置 / Settings</button>
            <button type="button" data-admin-view="system">系统 / System</button>
        </nav>
        <div class="admin-actions">
            <button id="clear-readings" class="admin-link danger-button" type="button">删除 / Delete</button>
            <a class="admin-link" href="Three.html">返回 / Back</a>
            <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle theme (T)">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <line x1="12" y1="2.6" x2="12" y2="5.2"/>
                        <line x1="12" y1="18.8" x2="12" y2="21.4"/>
                        <line x1="2.6" y1="12" x2="5.2" y2="12"/>
                        <line x1="18.8" y1="12" x2="21.4" y2="12"/>
                        <line x1="5.2" y1="5.2" x2="7.0" y2="7.0"/>
                        <line x1="17.0" y1="17.0" x2="18.8" y2="18.8"/>
                        <line x1="5.2" y1="18.8" x2="7.0" y2="17.0"/>
                        <line x1="17.0" y1="7.0" x2="18.8" y2="5.2"/>
                    </g>
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path d="M19.5 14.6A8.5 8.5 0 0 1 9.4 4.5a.6.6 0 0 0-.8-.7A9.6 9.6 0 1 0 20.2 15.4a.6.6 0 0 0-.7-.8z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="admin-shell">
        <section class="admin-grid">
            <aside class="admin-list-panel">
                <div class="admin-panel-title">已存记录 / Saved Readings</div>
                <label class="admin-search">
                    <span>搜索记录 / Search</span>
                    <input id="reading-search" type="search" aria-label="Search readings" placeholder="搜索 / Search...">
                </label>
                <div id="admin-status" class="admin-status">Connecting...</div>
                <div id="reading-list" class="reading-list"></div>
            </aside>

            <section class="admin-detail-panel">
                <div id="reading-detail" class="reading-detail">
                    <div class="empty-state">Select a reading</div>
                </div>
            </section>
        </section>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/spread_layout.js"></script>
    <script src="js/reading_replay.js"></script>
    <script src="js/admin_helpers.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
