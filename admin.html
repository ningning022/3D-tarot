<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akashic Tarot - Chronicle Admin</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="admin-page figma-stage">
    <header class="app-topbar admin-topbar">
        <a class="brand-lockup" href="Three.html" aria-label="Back to Akashic Tarot">
            <span class="brand-sigil" aria-hidden="true"></span>
            <span>
                <strong>Akashic Tarot</strong>
                <small>Admin Chronicle Archive</small>
            </span>
        </a>
        <nav class="admin-nav" aria-label="Admin sections">
            <button type="button" data-admin-view="dashboard">总览 / Dashboard</button>
            <button type="button" data-admin-view="readings" class="active">记录 / Readings</button>
            <button type="button" data-admin-view="decks">牌库 / Decks</button>
            <button type="button" data-admin-view="settings">设置 / Settings</button>
            <button type="button" data-admin-view="system">系统 / System</button>
        </nav>
        <div class="admin-actions">
            <button id="clear-readings" class="admin-link danger-button" type="button">删除 / Delete</button>
            <a class="admin-link" href="Three.html">返回 / Back</a>
        </div>
    </header>

    <main class="admin-shell">
        <section class="admin-grid">
            <aside class="admin-list-panel">
                <div class="admin-panel-title">已存记录 / Saved Readings</div>
                <label class="admin-search">
                    <span>搜索记录 / Search</span>
                    <input id="reading-search" type="search" aria-label="Search readings" placeholder="搜索 / Search...">
                </label>
                <div id="admin-status" class="admin-status">Connecting...</div>
                <div id="reading-list" class="reading-list"></div>
            </aside>

            <section class="admin-detail-panel">
                <div id="reading-detail" class="reading-detail">
                    <div class="empty-state">Select a reading</div>
                </div>
            </section>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/spread_layout.js"></script>
    <script src="js/reading_replay.js"></script>
    <script src="js/admin_helpers.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
